edition = "2023";

package testdata;

option features.field_presence = IMPLICIT;

message EditionsMessage {
  string name = 1;
  int32 count = 2 [features.field_presence = EXPLICIT];
  repeated int32 values = 3 [features.repeated_field_encoding = EXPANDED];
  Child child = 4 [features.message_encoding = DELIMITED];

  message Child {
    string value = 1;
  }
}

enum EditionsEnum {
  option features.enum_type = CLOSED;
  EDITIONS_ENUM_A = 1;
  EDITIONS_ENUM_B = 2;
}
